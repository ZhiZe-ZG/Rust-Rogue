[package]
name = "rust-rogue"
version = "0.1.0"
edition = "2021"

[lib]
name = "rogue_rust"
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
clap = { version = "4", features = ["derive"] }
rand = "0.8"
glam = { version = "0.29", features = ["serde"] }
libc = "0.2"
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
ron = "0.8"
